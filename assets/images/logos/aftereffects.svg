<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="aeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9999ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141432"/>
      <stop offset="100%" stop-color="#070719"/>
    </linearGradient>
    <linearGradient id="aeTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfcfff"/>
      <stop offset="50%" stop-color="#9999ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <!-- Background Glow & Rounded Icon Box -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#aeGlow)" />
  <rect x="14" y="14" width="92" height="92" rx="22" fill="url(#aeBg)" stroke="rgba(153, 153, 255, 0.6)" stroke-width="2.5" />
  
  <!-- Classic Bold "Ae" Glyph -->
  <text x="60" y="74" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#aeTextGrad)" text-anchor="middle" letter-spacing="-1">Ae</text>
  <!-- Tiny Accent Dot -->
  <circle cx="88" cy="36" r="3.5" fill="#00f0ff" />
</svg>
